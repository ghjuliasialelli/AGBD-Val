[project]
name = "agbd-val"
version = "0.1.0"
description = "Validation testbed for above-ground biomass (AGB) maps: reference-data catalog, download pipeline, and allometric AGB extraction from structure/CHM products."
readme = "catalog/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "shapely>=2.0",
    "scipy>=1.11",
    "pyarrow>=15",
    "requests>=2.31",
]

[tool.uv]
package = false
